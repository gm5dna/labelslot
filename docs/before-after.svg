    <rect x="821.08" y="179.92" width="6" height="6" />
    <rect x="829.08" y="179.92" width="6" height="6" />
    <rect x="805.08" y="187.92" width="6" height="6" />
    <rect x="813.08" y="187.92" width="6" height="6" />
