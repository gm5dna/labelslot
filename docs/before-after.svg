<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500"
     style="background:white" font-family="Helvetica, Arial, sans-serif">
  <!-- Solid white backdrop so the drawing reads the same in GitHub's light and dark themes. -->
  <rect x="0" y="0" width="900" height="500" fill="white" />

  <!-- Left sheet: A4 page (210x297mm at 1.2px/mm), label sheet ll04 (2x2, 99.1x139mm),
       eBay label content occupies position 1 only. -->
  <rect x="40" y="40" width="252" height="356.4" fill="white" stroke="#1a1a1a" stroke-width="1.5" />

  <!-- Position outlines (cut lines), left sheet -->
  <rect x="45.58" y="51.4" width="118.92" height="166.8" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 2" />
  <rect x="167.5" y="51.4" width="118.92" height="166.8" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 2" />
  <rect x="45.58" y="218.2" width="118.92" height="166.8" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 2" />
  <rect x="167.5" y="218.2" width="118.92" height="166.8" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 2" />

