  <line x1="64.92" y1="75.68" x2="126.92" y2="75.68" stroke="#1a1a1a" stroke-width="3" />
  <line x1="64.92" y1="85.68" x2="111.92" y2="85.68" stroke="#1a1a1a" stroke-width="3" />
  <line x1="64.92" y1="95.68" x2="118.92" y2="95.68" stroke="#1a1a1a" stroke-width="3" />
