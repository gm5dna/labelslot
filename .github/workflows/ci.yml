name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Guard against shipping something Node cannot run from node_modules (e.g. raw .ts): install
      # the packed tarball into an empty project and run the bin from there.
      - run: npm pack && mkdir /tmp/packtest && cd /tmp/packtest && npm init -y >/dev/null && npm install "$GITHUB_WORKSPACE"/labelslot-*.tgz && npx labelslot --list-sheets
